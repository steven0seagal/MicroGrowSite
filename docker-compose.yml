version: '3.8'

services:
  # =============================================================================
  # FRONTEND SERVICE (Nginx + ModSecurity + React SPA)
  # =============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    image: microgrow-frontend:latest
    container_name: microgrow-frontend
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # SSL certificates (self-signed for local, Let's Encrypt for production)
      # For Let's Encrypt: uncomment named volumes below and comment bind mount
      - ./ssl:/etc/letsencrypt:ro
      # - letsencrypt-certs:/etc/letsencrypt:ro

      # Certbot webroot for ACME challenge
      - ./ssl/www:/var/www/certbot:ro

      # DH parameters (will be generated by entrypoint on first run)
      - ./ssl:/etc/nginx/ssl

      # Note: Logs now go to stdout/stderr (Docker best practice)
      # View with: docker compose logs frontend

    networks:
      - microgrow-network

    environment:
      - TZ=Europe/Warsaw

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # Required for binding to ports 80/443
      - CHOWN
      - SETUID
      - SETGID

    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /var/cache/nginx:noexec,nosuid,nodev,size=50m
      - /var/run:noexec,nosuid,nodev,size=10m

  # =============================================================================
  # CERTBOT SERVICE (Let's Encrypt Certificate Management)
  # =============================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: microgrow-certbot

    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl/www:/var/www/certbot
      - ./logs/certbot:/var/log/letsencrypt

    networks:
      - microgrow-network

    # Run certificate renewal check daily at 3 AM
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

    depends_on:
      - frontend

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  letsencrypt-certs:
    driver: local
  letsencrypt-www:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  microgrow-network:
    driver: bridge
