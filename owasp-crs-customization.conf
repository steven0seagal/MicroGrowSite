# =============================================================================
# OWASP CRS CUSTOMIZATION & FALSE POSITIVE HANDLING
# =============================================================================

# Set paranoia level (1-4)
# Level 1: Basic protection (fewer false positives)
# Level 2: Moderate protection (RECOMMENDED for balanced security)
# Level 3: High protection (more false positives)
# Level 4: Maximum protection (many false positives)
SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=2"

# Anomaly scoring thresholds
# Lower = more sensitive (more blocks), higher = fewer blocks
SecAction \
 "id:900110,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# Sampling percentage (for performance in high-traffic)
# 100 = scan all requests, 10 = scan 10% (use 100 for maximum security)
SecAction \
 "id:900400,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.sampling_percentage=100"

# =============================================================================
# FALSE POSITIVE EXCEPTIONS
# =============================================================================
# Add exceptions here after testing if legitimate traffic is blocked
#
# Example: Whitelist specific React Router paths that trigger false positives
# SecRule REQUEST_URI "@beginsWith /products/" \
#     "id:9001,phase:1,nolog,pass,ctl:ruleRemoveById=942100"
#
# Example: Allow specific patterns for specific paths
# SecRule REQUEST_URI "@streq /api/search" \
#     "id:9002,phase:1,nolog,pass,ctl:ruleRemoveById=941000"

# =============================================================================
# IP WHITELIST (Optional: trusted IPs that bypass ModSecurity)
