# =============================================================================
# MAIN NGINX CONFIGURATION - HARDENED FOR PRODUCTION
# =============================================================================

# Run as non-root user
user nginx;

# Auto-detect CPU cores for optimal performance
worker_processes auto;

# Error log to stderr (Docker best practice)
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

# Increase file descriptor limit
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll; # Efficient on Linux
    multi_accept on;
}

http {
    # =============================================================================
    # BASIC SETTINGS
    # =============================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security info
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /dev/stdout main;

    # =============================================================================
    # PERFORMANCE OPTIMIZATIONS
    # =============================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;

    # =============================================================================
    # SECURITY: HIDE NGINX VERSION
    # =============================================================================
    server_tokens off;

    # =============================================================================
    # SECURITY: RATE LIMITING (Defense against DDoS)
    # =============================================================================
    # Zone for general requests: 10 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Zone for stricter limiting (API-like endpoints): 5 req/s per IP
    limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;

    # Connection limit: max 10 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Status code for rate limit exceeded
    limit_req_status 429;
    limit_conn_status 429;

    # =============================================================================
    # SECURITY: REQUEST SIZE LIMITS (Prevent buffer overflow attacks)
    # =============================================================================
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeout protection against slowloris attacks
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;

    # =============================================================================
    # COMPRESSION (Performance + Bandwidth Saving)
    # =============================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # =============================================================================
    # SSL/TLS SETTINGS (Modern configuration)
    # =============================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off; # TLS 1.3 best practice

    # SSL session cache for performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling for performance
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # DH parameters for DHE ciphers (generated by entrypoint on first run)
    # Uncomment after dhparam.pem is generated
    # ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # =============================================================================
    # HTTP SERVER (Redirect to HTTPS)
    # =============================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Allow Let's Encrypt ACME challenge
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================================================================
    # HTTPS SERVER (Main Application)
    # =============================================================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;

        # CHANGE THIS: Your domain name
        server_name localhost microgrow.bio www.microgrow.bio;

        # SSL Certificate paths (Let's Encrypt or self-signed)
        # For self-signed: create with: openssl req -x509 -nodes -days 365 -newkey rsa:4096 -keyout /etc/nginx/ssl/privkey.pem -out /etc/nginx/ssl/fullchain.pem
        ssl_certificate /etc/letsencrypt/live/microgrow.bio/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/microgrow.bio/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/microgrow.bio/chain.pem;

        # Root directory
        root /var/www/html;
        index index.html;

        # =============================================================================
        # SECURITY HEADERS (OWASP Recommendations)
        # =============================================================================
        # Strict Transport Security (HSTS): Force HTTPS for 2 years
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Content Security Policy (CSP): Restrict resource loading
        # NOTE: 'unsafe-inline' needed for React inline styles - consider using nonce in production
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Enable XSS filter in browsers
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions policy (formerly Feature-Policy)
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

        # =============================================================================
        # RATE LIMITING
        # =============================================================================
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        # =============================================================================
        # STATIC ASSET CACHING (Performance)
        # =============================================================================
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;

            # Security headers for cached assets
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Security headers
            add_header X-Content-Type-Options "nosniff" always;
        }

        # =============================================================================
        # SPA ROUTING (React Router DOM)
        # =============================================================================
        location / {
            try_files $uri $uri/ /index.html;

            # Security: Prevent index.html caching (always get latest version)
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";

                # Re-add security headers for index.html (nested locations don't inherit add_header)
                add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
            }
        }

        # =============================================================================
        # SECURITY: DENY ACCESS TO HIDDEN FILES
        # =============================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # =============================================================================
        # SECURITY: DENY ACCESS TO SENSITIVE FILES
        # =============================================================================
        location ~* \.(env|log|ini|conf|bak|sql|json)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # =============================================================================
        # HEALTH CHECK ENDPOINT (for Docker healthcheck)
        # =============================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =============================================================================
        # NGINX STATUS (Optional: for monitoring, restrict to localhost)
        # =============================================================================
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
