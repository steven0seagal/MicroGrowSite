# =============================================================================
# MODSECURITY 3.x MAIN CONFIGURATION
# =============================================================================

# Enable ModSecurity engine
SecRuleEngine On

# Request body handling
SecRequestBodyAccess On
SecRequestBodyLimit 13107200  # 12.5 MB
SecRequestBodyNoFilesLimit 131072  # 128 KB
SecRequestBodyLimitAction Reject

# Response body handling (for outbound scanning)
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json
SecResponseBodyLimit 524288  # 512 KB
SecResponseBodyLimitAction ProcessPartial

# Temporary directory for file uploads scanning
SecTmpDir /tmp/
SecDataDir /tmp/

# Debug logging (DISABLE in production after testing)
SecDebugLog /var/log/nginx/modsec_debug.log
SecDebugLogLevel 0  # 0=disabled, 9=everything

# Audit logging (security events)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/nginx/modsec_audit.log

# =============================================================================
# BLOCKING BEHAVIOR
# =============================================================================
# Block immediately on detection (not DetectionOnly)
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# =============================================================================
# CUSTOM RULES (Pre-OWASP CRS)
# =============================================================================

# Block suspicious user agents (common attack tools)
SecRule REQUEST_HEADERS:User-Agent "@rx (nikto|nessus|nmap|masscan|sqlmap|metasploit|burpsuite|w3af|acunetix|openvas)" \
    "id:1001,phase:1,deny,status:403,log,msg:'Malicious User-Agent Detected'"

# Block requests with no User-Agent (common in automated attacks)
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1002,phase:1,deny,status:403,log,msg:'Missing User-Agent Header'"

# Block common path traversal attempts
SecRule REQUEST_URI "@rx \.\./|\.\.\\|%2e%2e" \
    "id:1004,phase:1,deny,status:403,log,msg:'Path Traversal Attempt'"

# =============================================================================
# LOAD OWASP CORE RULE SET (CRS)
# =============================================================================
Include /etc/nginx/owasp-crs/crs-setup.conf
Include /etc/nginx/owasp-crs/rules/*.conf
Include /etc/nginx/owasp-crs/owasp-crs-customization.conf
